<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DEXXUS Shield – Erklärfilm</title>
<style>
  :root{ --bg:#EEF2F8; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --accent:#2563EB; --accent2:#60A5FA;
         --wissen:#8B5CF6; --deep:#0F172A; --mark:#FEF3C7; --markink:#92400E; --ok:#10B981; --rot:#DC2626;
         --surface:#FFFFFF; --f:"Segoe UI",system-ui,Arial,sans-serif; --mono:ui-monospace,Consolas,Menlo,monospace; }
  html,body{margin:0;background:var(--bg);font-family:var(--f);}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;
      background:
        radial-gradient(900px 520px at 50% -8%, #ffffff, rgba(255,255,255,0) 70%),
        radial-gradient(1200px 700px at 50% 120%, #E2E8F5, rgba(226,232,245,0) 60%),
        var(--bg);}
  #dots{position:absolute;inset:0;background-image:radial-gradient(rgba(100,116,139,.12) 1.3px, transparent 1.3px);
        background-size:30px 30px;-webkit-mask-image:radial-gradient(900px 560px at 50% 50%, #000 55%, transparent 85%);
        mask-image:radial-gradient(900px 560px at 50% 50%, #000 55%, transparent 85%);}
  .card{position:absolute;width:300px;background:var(--surface);border:1px solid var(--line);
        border-radius:16px;box-shadow:0 18px 44px rgba(15,23,42,.16);padding:16px 18px;box-sizing:border-box;}
  .card .k{font:700 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
  .card .t{font:15.5px/1.65 var(--f);color:var(--ink);white-space:pre-wrap;}
  .card .t mark{background:var(--mark);color:var(--markink);border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:.9em;}
  #titel{position:absolute;left:0;right:0;top:30px;text-align:center;font:800 32px var(--f);color:var(--deep);letter-spacing:-.015em;}
  #titel small{display:block;font:600 15px var(--f);color:var(--muted);margin-top:5px;letter-spacing:.02em;}
  #caption{position:absolute;left:0;right:0;top:118px;text-align:center;font:700 24px var(--f);color:var(--deep);}
  #capnr{display:inline-flex;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
         align-items:center;justify-content:center;font-size:18px;margin-right:13px;vertical-align:middle;box-shadow:0 6px 16px rgba(37,99,235,.35);}
  #progress{position:absolute;left:140px;right:140px;bottom:32px;height:5px;background:#dbe2ee;border-radius:5px;}
  #progbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;}
  .fig{position:absolute;}
  .lbl{font:600 13px var(--f);fill:var(--muted);}
  .nm{font:800 17px var(--f);fill:#334155;}
</style>
</head>
<body>
<div id="stage">
  <div id="dots"></div>
  <div id="titel">DEXXUS&nbsp;Shield<small>KI nutzen – Personendaten behalten</small></div>

  <svg id="wires" style="position:absolute;inset:0;pointer-events:none" width="1280" height="720" viewBox="0 0 1280 720">
    <path d="M250 300 C 360 300, 420 330, 515 345" fill="none" stroke="#C7D2FE" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M770 320 C 900 280, 1000 230, 1070 205" fill="none" stroke="#DDD6FE" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  </svg>

  <svg class="fig" id="bexio" style="left:55px;top:150px" width="210" height="140" viewBox="0 0 210 140">
    <rect x="5" y="6" width="200" height="112" rx="14" fill="#fff" stroke="#E2E8F0"/>
    <path d="M5 20 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v12 H5 z" fill="#0F172A"/>
    <circle cx="20" cy="19" r="4.5" fill="#F87171"/><circle cx="36" cy="19" r="4.5" fill="#FBBF24"/><circle cx="52" cy="19" r="4.5" fill="#34D399"/>
    <text x="105" y="70" text-anchor="middle" class="nm">Ihre Software</text>
    <text x="105" y="95" text-anchor="middle" class="lbl">bexio · SelectLine · Abacus</text>
  </svg>
  <svg class="fig" id="person" style="left:95px;top:300px" width="150" height="210" viewBox="0 0 150 210">
    <ellipse cx="75" cy="196" rx="52" ry="10" fill="rgba(15,23,42,.06)"/>
    <path d="M26 188 q0 -74 49 -74 q49 0 49 74 q-49 20 -98 0 z" fill="#93A4BD"/>
    <path d="M31 186 q0 -66 44 -66 q44 0 44 66 q-44 16 -88 0 z" fill="#B9C5D8"/>
    <circle cx="75" cy="58" r="33" fill="#8FA1BB"/><circle cx="75" cy="56" r="29" fill="#CBD5E1"/>
    <text x="75" y="208" text-anchor="middle" class="nm" style="font-size:16px">Sie</text>
  </svg>

  <div class="fig" id="shieldbox" style="left:510px;top:235px;width:260px;">
    <svg width="260" height="230" viewBox="0 0 260 230">
      <defs>
        <linearGradient id="shg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF3FF"/><stop offset="1" stop-color="#DBE4FF"/></linearGradient>
        <linearGradient id="shr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
      </defs>
      <rect x="4" y="6" width="252" height="210" rx="22" fill="#fff" stroke="#E2E8F0"/>
      <circle id="halo" cx="130" cy="104" r="78" fill="none" stroke="#BFDBFE" stroke-width="3" opacity="0"/>
      <path id="shield" d="M130 34 l62 22 v46 q0 60 -62 84 q-62 -24 -62 -84 v-46 z" fill="url(#shg)" stroke="url(#shr)" stroke-width="4"/>
      <path d="M106 118 l17 17 l33 -37" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="206" text-anchor="middle" style="font:800 20px var(--f);fill:#1E3A8A">DEXXUS Shield</text>
    </svg>
  </div>

  <svg class="fig" id="robot" style="left:1045px;top:110px" width="200" height="210" viewBox="0 0 200 210">
    <line x1="100" y1="58" x2="100" y2="40" stroke="#8B5CF6" stroke-width="3"/><circle id="ant" cx="100" cy="36" r="6" fill="#8B5CF6"/>
    <rect x="46" y="58" width="108" height="96" rx="18" fill="#F1ECFE" stroke="#8B5CF6" stroke-width="3"/>
    <rect x="68" y="84" width="64" height="34" rx="9" fill="#fff" stroke="#8B5CF6" stroke-width="2"/>
    <circle id="eyeL" cx="88" cy="101" r="7" fill="#8B5CF6"/><circle id="eyeR" cx="112" cy="101" r="7" fill="#8B5CF6"/>
    <rect x="84" y="130" width="32" height="7" rx="3" fill="#C4B5FD"/>
    <text x="100" y="180" text-anchor="middle" style="font:700 16px var(--f);fill:#6D28D9">Online-KI</text>
    <text x="100" y="198" text-anchor="middle" class="lbl">ChatGPT · Claude · Gemini</text>
  </svg>

  <!-- Geschützte Datei (hinter der Wand) -->
  <svg class="fig" id="safe" style="left:742px;top:498px;opacity:0" width="120" height="150" viewBox="0 0 120 150">
    <ellipse cx="60" cy="140" rx="40" ry="8" fill="rgba(15,23,42,.07)"/>
    <rect x="24" y="16" width="72" height="94" rx="9" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="36" y="34" width="48" height="6" rx="3" fill="#CBD5E1"/><rect x="36" y="48" width="48" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="36" y="62" width="34" height="6" rx="3" fill="#CBD5E1"/>
    <circle cx="84" cy="92" r="17" fill="#10B981"/><path d="M76 92 l5 5 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="134" text-anchor="middle" class="nm" style="font-size:13px;fill:#059669">Ihre Datei</text>
  </svg>
  <!-- Shield-Schutzwand aus Punkten -->
  <svg class="fig" id="wall" style="left:872px;top:446px;opacity:0" width="86" height="210" viewBox="0 0 86 210">
    <defs><pattern id="wd" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="7.5" cy="7.5" r="2.3" fill="#3B82F6" opacity=".6"/></pattern></defs>
    <rect x="16" y="6" width="54" height="198" rx="27" fill="#3B82F6" opacity=".10"/>
    <rect x="16" y="6" width="54" height="198" rx="27" fill="url(#wd)"/>
    <rect x="16" y="6" width="54" height="198" rx="27" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 7"/>
    <g transform="translate(43,105)"><path d="M0 -24 l18 6 v14 q0 17 -18 24 q-18 -7 -18 -24 v-14 z" fill="#fff" stroke="#2563EB" stroke-width="3"/>
      <path d="M-7 0 l5 5 l10 -12" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
  <!-- Aufprall-Funken -->
  <svg class="fig" id="spark" style="left:918px;top:522px;opacity:0" width="80" height="80" viewBox="0 0 80 80">
    <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round"><line x1="40" y1="40" x2="40" y2="10"/><line x1="40" y1="40" x2="68" y2="24"/>
      <line x1="40" y1="40" x2="72" y2="48"/><line x1="40" y1="40" x2="60" y2="68"/><line x1="40" y1="40" x2="36" y2="72"/></g>
    <circle cx="40" cy="40" r="10" fill="#FDE68A"/>
  </svg>
  <!-- Blitz vom Hacker-PC zur Wand -->
  <svg class="fig" id="bolt" style="left:948px;top:528px;opacity:0" width="160" height="70" viewBox="0 0 160 70">
    <path d="M150 20 L96 30 L120 36 L40 44 L66 50 L6 46" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M150 20 L96 30 L120 36 L40 44 L66 50 L6 46" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <!-- Hacker-Computer mit Person -->
  <svg class="fig" id="hackpc" style="left:1050px;top:472px;opacity:0" width="200" height="200" viewBox="0 0 200 200">
    <ellipse cx="105" cy="188" rx="80" ry="11" fill="rgba(15,23,42,.08)"/>
    <path d="M132 188 q0 -44 32 -44 q32 0 32 44 z" fill="#334155"/><circle cx="164" cy="118" r="21" fill="#475569"/>
    <rect x="14" y="40" width="140" height="96" rx="10" fill="#0B1220" stroke="#1F2937" stroke-width="3"/>
    <rect x="26" y="52" width="116" height="72" rx="4" fill="#0F172A"/>
    <text x="36" y="74" style="font:700 12px var(--mono);fill:#34D399">01011001</text>
    <text x="36" y="92" style="font:700 12px var(--mono);fill:#34D399">10100110</text>
    <path d="M86 100 l11 0 l-5 14 l9 0 l-16 20 l5 -16 l-9 0 z" fill="#F87171"/>
    <rect x="58" y="150" width="62" height="8" rx="3" fill="#334155"/>
    <text x="84" y="184" text-anchor="middle" class="nm" style="font-size:15px;fill:#B91C1C">Hacker</text>
  </svg>

  <div class="card" id="doc" style="left:300px;top:360px;">
    <div class="k" id="dock">Aus Ihrer Software</div>
    <div class="t" id="doct"></div>
  </div>

  <div id="caption"><span id="capnr">1</span><span id="captext"></span></div>
  <div id="progress"><div id="progbar"></div></div>
</div>

<script>
const T=18;
const REAL='Mahnung an <b>Muster Bau AG</b>,\nFrau <b>Erika Muster</b>,\n<b>Bahnhofstrasse 12, 8001 Zürich</b>,\nIBAN <b>CH06 0900 0000 …</b>';
const MASK='Mahnung an <mark>[Firma 1]</mark>,\nFrau <mark>[Person 1]</mark>,\n<mark>[Adresse 1]</mark>, <mark>[Ort 1]</mark>,\nIBAN <mark>[IBAN 1]</mark>';
const ANSW_MASK='Sehr geehrte <mark>[Person 1]</mark>,\nwir bitten Sie, den offenen\nBetrag auf <mark>[IBAN 1]</mark> zu\nüberweisen. Freundliche Grüsse';
const ANSW_REAL='Sehr geehrte <b>Frau Muster</b>,\nwir bitten Sie, den offenen\nBetrag auf <b>CH06 0900 …</b> zu\nüberweisen. Freundliche Grüsse';
const $=id=>document.getElementById(id);
const doc=$('doc'),doct=$('doct'),dock=$('dock'),capnr=$('capnr'),captext=$('captext'),progbar=$('progbar');
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function fade(a,b,c,d,x){ if(x<a||x>d)return 0; if(x<b)return (x-a)/(b-a); if(x>c)return 1-(x-c)/(d-c); return 1; }
const POS=[[0,300,360],[2.2,300,360],[3.6,560,310],[10,560,310],[11.5,740,185],[13.5,740,185],[15,560,310],[16.5,300,360],[18,300,360]];
function posAt(t){for(let i=0;i<POS.length-1;i++){const a=POS[i],b=POS[i+1];if(t>=a[0]&&t<=b[0]){const f=ease((t-a[0])/(b[0]-a[0]||1));return [lerp(a[1],b[1],f),lerp(a[2],b[2],f)];}}const l=POS[POS.length-1];return [l[1],l[2]];}
function seek(t){
  t=Math.max(0,Math.min(T,t));
  const [x,y]=posAt(t); doc.style.left=x+'px'; doc.style.top=y+'px';
  progbar.style.width=(t/T*100)+'%';
  let html=REAL,kopf='Aus Ihrer Software',cap='In Ihrer Software kopieren',nr='1',col='var(--accent)';
  if(t>=2.2&&t<3.6){cap='Text kopieren';nr='1';}
  if(t>=3.6&&t<7){kopf='DEXXUS Shield';const p=(t-4.2)/2;html=p<=0?REAL:(p>=1?MASK:(Math.floor(t*6)%2?MASK:REAL));cap='DEXXUS schwärzt die Daten';nr='2';}
  if(t>=7&&t<10){html=MASK;kopf='Geschwärzt – geschützt';cap='Hacker haben keine Chance – das Shield schützt';nr='🔒';col='var(--rot)';}
  if(t>=10&&t<11.5){html=MASK;kopf='Geschwärzt';cap='Geschwärzt an die KI senden';nr='3';col='var(--wissen)';}
  if(t>=11.5&&t<13.5){html=ANSW_MASK;kopf='Antwort der KI';cap='Die KI sieht nie echte Namen';nr='3';col='var(--wissen)';}
  if(t>=13.5&&t<15){kopf='Echte Angaben eingesetzt';const p=(t-13.7)/1.1;html=p>=1?ANSW_REAL:(Math.floor(t*6)%2?ANSW_REAL:ANSW_MASK);cap='Echte Namen wieder einsetzen';nr='4';}
  if(t>=15&&t<16.5){html=ANSW_REAL;kopf='Zurück in Ihrer Software';cap='Fertiger Text zurück';nr='4';col='var(--accent)';}
  if(t>=16.5){html=ANSW_REAL;kopf='Fertig';cap='Fertig – Ihre Daten blieben auf dem PC';nr='✓';col='var(--ok)';}
  doct.innerHTML=html; dock.textContent=kopf; captext.textContent=cap; capnr.textContent=nr; capnr.style.background=col;
  const ho=fade(7.0,7.6,9.5,10.2,t);
  $('safe').style.opacity=ho; $('wall').style.opacity=ho; $('hackpc').style.opacity=ho;
  const flick=(t>=7.6&&t<9.7)?(0.3+0.7*Math.abs(Math.sin(t*11))):0;
  $('bolt').style.opacity=ho?flick:0; $('spark').style.opacity=ho?flick:0;
  const sh=(t>=3.6&&t<7); $('halo').setAttribute('opacity', sh?(.4+.4*Math.abs(Math.sin(t*5))):0);
  $('shield').setAttribute('transform', sh?('translate(130 104) scale('+(1+.02*Math.sin(t*6))+') translate(-130 -104)'):'');
  const blink=(t>=11.5&&t<13.5)?(2.5+3*Math.abs(Math.sin(t*8))):7; $('eyeL').setAttribute('r',blink); $('eyeR').setAttribute('r',blink);
  $('ant').setAttribute('fill',((t>=11.5&&t<13.5)&&Math.floor(t*4)%2)?'#C4B5FD':'#8B5CF6');
}
window.seek=seek;
let start=null;
function frame(ts){ if(!start)start=ts; let t=((ts-start)/1000)%(T+1.3); seek(t); requestAnimationFrame(frame); }
if(!location.search.includes('static')) requestAnimationFrame(frame); else seek(parseFloat(new URLSearchParams(location.search).get('t')||0));
</script>
</body>
</html>
